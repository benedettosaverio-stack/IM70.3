    --red:#e2131f; --red-glow:rgba(226,19,31,0.35);
    --white:#eef0ee; --grey:#7d8288; --grey-dim:#4a4d50; --amber:#ffb100;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{background:var(--bg); color:var(--white); font-family:-apple-system,'Segoe UI',sans-serif; min-height:100vh;}
  body{padding-bottom:calc(46px + env(safe-area-inset-bottom));}
  .mono{font-family:ui-monospace,'JetBrains Mono',Consolas,Menlo,monospace;}
  button{font-family:inherit; cursor:pointer;}

  #boot{position:fixed; inset:0; background:var(--bg); z-index:999; display:flex; align-items:center; justify-content:center; flex-direction:column; transition:opacity 0.3s ease;}
  #boot .line{font-family:ui-monospace,monospace; font-size:12px; color:var(--red); letter-spacing:0.08em; margin:3px 0; opacity:0; animation:fadeIn 0.25s forwards;}
  #boot .line:nth-child(1){animation-delay:0.03s;}
  #boot .line:nth-child(2){animation-delay:0.22s;}
  #boot .line:nth-child(3){animation-delay:0.4s;}
  @keyframes fadeIn{to{opacity:1;}}

  .scan-bg{position:fixed; inset:0; pointer-events:none; z-index:0; background:repeating-linear-gradient(180deg, rgba(255,255,255,0.012) 0 1px, transparent 1px 3px);}

  .console-header{
    position:relative; padding:calc(20px + env(safe-area-inset-top)) 18px 18px;
    border-bottom:1px solid var(--line);
    background:radial-gradient(ellipse at top left, var(--red-glow), transparent 55%);
    overflow:hidden;
  }
  .status-row{display:flex; justify-content:space-between; align-items:center; font-family:ui-monospace,monospace; font-size:10.5px; color:var(--grey); letter-spacing:0.08em; text-transform:uppercase; margin-bottom:14px;}
  .status-dot{display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--red); margin-right:6px; box-shadow:0 0 6px var(--red);}
  .greeting{font-size:25px; font-weight:700; letter-spacing:-0.01em;}
  .greeting span{color:var(--red);}
  .date-line{font-family:ui-monospace,monospace; font-size:12px; color:var(--grey); margin-top:4px; text-transform:capitalize;}
  .hud-stats{display:flex; gap:0; margin-top:16px; border:1px solid var(--line); border-radius:2px; overflow:hidden;}
  .hud-stat{flex:1; padding:9px 10px; border-right:1px solid var(--line);}
  .hud-stat:last-child{border-right:none;}
  .hud-stat .v{font-family:ui-monospace,monospace; font-size:18px; color:var(--red); font-weight:700;}
  .hud-stat .l{font-size:9px; color:var(--grey); text-transform:uppercase; letter-spacing:0.05em; margin-top:2px;}

  .nav{position:sticky; top:0; z-index:6; background:var(--bg); display:flex; gap:0; overflow-x:auto; padding:0 18px; border-bottom:1px solid var(--line);}
  .nav-btn{background:none; border:none; color:var(--grey); font-size:13px; font-weight:600; padding:13px 14px; white-space:nowrap; border-bottom:2px solid transparent; text-transform:uppercase; letter-spacing:0.04em;}
  .nav-btn.active{color:var(--white); border-bottom-color:var(--red);}

  .content{position:relative; z-index:1; padding:18px 18px 10px; max-width:720px; margin:0 auto;}

  .date-nav{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .date-nav-btn{background:var(--panel); border:1px solid var(--line); color:var(--white); width:40px; height:40px; font-size:18px; border-radius:2px;}
  .selected-date{font-family:ui-monospace,monospace; font-size:12px; color:var(--grey); text-transform:capitalize; text-align:center; flex:1;}
  .today-pill{background:none; border:1px solid var(--red); color:var(--red); font-size:10px; padding:5px 10px; border-radius:20px; text-transform:uppercase; letter-spacing:0.05em; font-weight:700;}
  input[type=date]{background:var(--panel); border:1px solid var(--line); color:var(--white); font-family:ui-monospace,monospace; font-size:11px; padding:6px 8px; border-radius:2px;}

  .session-card{background:var(--panel); border:1px solid var(--line); border-top:3px solid var(--red); padding:22px 18px; position:relative; overflow:hidden;}
  .session-card.type-swim{border-top-color:#2ea3c9;}
  .session-card.type-bike{border-top-color:var(--amber);}
  .session-card.type-run{border-top-color:#4fbf6b;}
  .session-card.type-brick{border-top-color:#b478e0;}
  .session-card.type-rest{border-top-color:#3a3d40;}
  .session-card.type-race{border-top-color:var(--red); background:linear-gradient(160deg, rgba(226,19,31,0.08), var(--panel) 60%);}
  .session-phase-tag{font-family:ui-monospace,monospace; font-size:10px; color:var(--red); text-transform:uppercase; letter-spacing:0.1em;}
  .session-title{font-size:23px; font-weight:700; margin-top:6px; line-height:1.15;}
  .session-day{font-family:ui-monospace,monospace; font-size:11px; color:var(--grey); text-transform:uppercase; margin-top:3px; letter-spacing:0.06em;}
  .rotation-label{font-size:10.5px; color:var(--red); text-transform:uppercase; letter-spacing:0.05em; font-weight:700; margin-top:16px; margin-bottom:2px;}
  .ex-progress{font-size:10.5px; color:var(--grey); margin-top:12px; text-transform:uppercase; letter-spacing:0.05em;}
  .ex-list{list-style:none; display:flex; flex-direction:column; gap:2px; margin-top:8px;}
  .ex-item{display:flex; align-items:flex-start; gap:11px; font-size:13.5px; color:#d3d4d1; line-height:1.5; padding:9px 4px; border-radius:3px;}
  .ex-item:active{background:rgba(255,255,255,0.04);}
  .ex-box{flex-shrink:0; width:19px; height:19px; border:1.5px solid var(--grey-dim); border-radius:4px; margin-top:1px; display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--red);}
  .ex-item.done .ex-box{border-color:var(--red); background:rgba(226,19,31,0.15);}
  .ex-item.done .ex-text{color:var(--grey-dim); text-decoration:line-through;}
  .session-note{font-size:12.5px; color:var(--grey); margin-top:16px; padding-top:14px; border-top:1px solid var(--line); line-height:1.55; font-style:italic;}

  .tomorrow-strip{display:flex; align-items:center; gap:11px; background:var(--panel); border:1px solid var(--line); padding:12px 14px; margin-top:10px; border-radius:2px;}
  .tomorrow-strip .tl{font-family:ui-monospace,monospace; font-size:9.5px; color:var(--grey); text-transform:uppercase; letter-spacing:0.06em;}
  .tomorrow-strip .tt{font-size:13px; font-weight:600; margin-top:1px;}

  .week-strip{display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-bottom:16px;}
  .week-day{background:var(--panel); border:1px solid var(--line); padding:10px 4px; text-align:center; border-radius:2px;}
  .week-day.selected{border-color:var(--red); background:rgba(226,19,31,0.08);}
  .week-day .wd{font-family:ui-monospace,monospace; font-size:9px; color:var(--grey); text-transform:uppercase;}
  .week-day .wn{font-size:15px; font-weight:700; margin-top:2px;}
  .week-day .wt{width:6px; height:6px; border-radius:50%; margin:6px auto 0; background:var(--grey-dim);}
  .week-day.type-force .wt{background:var(--red);}
  .week-day.type-swim .wt{background:#2ea3c9;}
  .week-day.type-bike .wt{background:var(--amber);}
  .week-day.type-run .wt{background:#4fbf6b;}
  .week-day.type-brick .wt{background:#b478e0;}

  .phase-progress{display:flex; align-items:center; gap:16px; margin:16px 0 20px;}
  .ring{width:70px; height:70px; flex-shrink:0;}
  .ring-track{fill:none; stroke:var(--line); stroke-width:5;}
  .ring-fill{fill:none; stroke:var(--red); stroke-width:5; stroke-linecap:round; transform:rotate(-90deg); transform-origin:50% 50%; transition:stroke-dashoffset 0.4s;}
  .ring-label{font-family:ui-monospace,monospace; font-size:9px; fill:var(--grey); text-anchor:middle;}
  .phase-desc{font-size:13.5px; color:#d3d4d1; line-height:1.6;}

  .info-card{background:var(--panel); border:1px solid var(--line); padding:17px; margin-bottom:11px;}
  .info-card h3{font-size:16px; font-weight:700; margin-bottom:7px;}
  .info-card p{font-size:13px; color:#c9cac7; line-height:1.6;}
  .level-badge{display:inline-block; background:var(--red); color:#fff; font-family:ui-monospace,monospace; font-size:10px; font-weight:700; padding:2px 8px; margin-bottom:8px; letter-spacing:0.05em;}

  .milestone{display:flex; justify-content:space-between; align-items:center; background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--red); padding:14px 16px; margin-bottom:9px;}
  .milestone.past{opacity:0.45; border-left-color:var(--grey-dim);}
  .milestone-title{font-size:14px; font-weight:600;}
  .milestone-date{font-family:ui-monospace,monospace; font-size:11px; color:var(--grey); margin-top:2px;}
  .milestone-count{font-family:ui-monospace,monospace; font-size:17px; color:var(--red); font-weight:700; text-align:right;}
  .milestone-count .u{font-size:9px; color:var(--grey); display:block; font-weight:400;}

  .section-title{font-size:20px; font-weight:700; margin-bottom:14px;}
  .flag{border-left:3px solid var(--amber); padding-left:12px; font-size:12.5px; color:#e8d9b8; line-height:1.6; margin-top:6px; margin-bottom:16px;}

  .subnav{display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;}
  .subnav-btn{background:var(--panel); border:1px solid var(--line); color:var(--grey); font-size:12px; font-weight:600; padding:8px 13px; border-radius:20px; text-transform:uppercase; letter-spacing:0.03em;}
  .subnav-btn.active{color:var(--white); border-color:var(--red); background:rgba(226,19,31,0.1);}

  @media(max-width:420px){
    .greeting{font-size:21px;}
    .session-title{font-size:19px;}
    .hud-stats{flex-wrap:wrap;}
    .hud-stat{flex:1 1 50%; border-bottom:1px solid var(--line);}
  }
</style>
</head>

function isoStr(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function diffDays(a,b){ return Math.round((a-b)/86400000); }
function addDays(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }
function todayOnly(){ const t=new Date(); return new Date(t.getFullYear(),t.getMonth(),t.getDate()); }
function fmtLong(d){ return d.toLocaleDateString('fr-FR',{weekday:'long', day:'numeric', month:'long', year:'numeric'}); }
function fmtShort(d){ return d.toLocaleDateString('fr-FR',{day:'2-digit', month:'2-digit', year:'numeric'}); }
function findPhase(iso){ return PHASES.find(p=> iso>=p.start && iso<=p.end); }

function getEntry(date){
  const iso = isoStr(date);
  const special = SPECIAL_EVENTS.find(e=>e.date===iso);
  if(special) return {type:'race', icon:'race', title:special.title, exos:[special.note], note:'Objectif : finir, gérer, en profiter.', phaseTag:'Jour de course'};
  const phase = findPhase(iso);
  if(!phase) return {type:'rest', icon:'rest', title:'Hors période couverte', exos:['Cette date est en dehors du plan.'], note:'', phaseTag:''};
  const wIdx = (date.getDay()+6)%7;
  let entry;
  if(wIdx===0 && ['phase1','phase2','phase3','phase4'].includes(phase.key)){
    const wn = Math.floor(diffDays(date, parseDate(phase.start))/7);
    const rot = MUSCU_LUNDI_ROT[((wn%3)+3)%3];
    entry = {type:'force', icon:'force', title:'Muscu — séance lourde', rotationLabel:rot.label, exos:rot.exos, note:MUSCU_LUNDI_NOTE};
  } else if(phase.key==='phase3' && wIdx===6){
    const wn = Math.floor(diffDays(date, parseDate(phase.start))/7);
    entry = {...(wn%2===0 ? S.bikeLong : S.runLong)};
  } else if(phase.key==='phase4' && wIdx===6){
    entry = {...(date.getDate()<=7 ? S.brickLong : S.bikeLong)};
  } else {
    const table = {phase0:PHASE0_WEEK, phase1:PHASE1_WEEK, phase2:PHASE2_WEEK, phase3:PHASE3_WEEK, phase4:PHASE4_WEEK, phase5:PHASE5_WEEK}[phase.key];
    entry = {...table[wIdx]};
  }
  entry.phaseTag = phase.tag + ' — ' + phase.title;
  entry._phaseKey = phase.key;
  return entry;
}

let selectedDate = todayOnly();
let activeTab = 'today';
let infoSubTab = 'contingency';
let CHECKED = {};

function renderHeader(){
  const today = todayOnly();
  document.getElementById('todayLine').textContent = fmtLong(today);
  const phase = findPhase(isoStr(today));
  document.getElementById('phaseLive').textContent = phase ? phase.tag.toUpperCase() : '—';
  const raceStart = parseDate('2028-04-01');
  const daysToRace = diffDays(raceStart, today);
  const inWindow = daysToRace <= 0 && diffDays(parseDate('2028-09-30'), today) >= 0;
  document.getElementById('hudStats').innerHTML =
    '<div class="hud-stat"><div class="v mono">'+(phase ? phase.tag.replace('Phase ','') : '—')+'</div><div class="l">Phase active</div></div>'+
    '<div class="hud-stat"><div class="v mono">'+(inWindow ? 'ACTIVE' : (daysToRace>0 ? 'J-'+daysToRace : '—'))+'</div><div class="l">'+(inWindow ? 'Fenêtre course' : 'Avant fenêtre course')+'</div></div>'+
    '<div class="hud-stat"><div class="v mono">103→90</div><div class="l">Kg (trajectoire)</div></div>'+
    '<div class="hud-stat"><div class="v mono">3x</div><div class="l">Muscu / semaine, fixe</div></div>';
}

function renderNav(){
  const tabs = [['today',"Aujourd'hui"],['week','Semaine'],['phase','Phase'],['milestones','Jalons'],['infos','Infos']];
  document.getElementById('nav').innerHTML = tabs.map(([k,l])=>'<button class="nav-btn '+(activeTab===k?'active':'')+'" onclick="setTab(\''+k+'\')">'+l+'</button>').join('');
}
function setTab(t){ activeTab=t; renderNav(); renderContent(); }
function setInfoSubTab(t){ infoSubTab=t; renderContent(); }

function shiftDate(n){ selectedDate = addDays(selectedDate,n); renderContent(); }
function jumpToday(){ selectedDate = todayOnly(); renderContent(); }
function onDatePick(v){ if(v){ selectedDate = parseDate(v); renderContent(); } }
function jumpTo(iso){ selectedDate = parseDate(iso); renderContent(); }

function toggleCheck(key){ CHECKED[key] = !CHECKED[key]; renderContent(); }

function sessionCardHTML(entry, dayLabel, dateIso){
  const rot = entry.rotationLabel ? '<div class="rotation-label">'+entry.rotationLabel+'</div>' : '';
  const exos = entry.exos||[];
  const done = exos.filter((_,i)=>CHECKED[dateIso+'_'+i]).length;
  const progress = exos.length>0 ? '<div class="ex-progress mono">'+done+'/'+exos.length+' fait'+(done>1?'s':'')+'</div>' : '';
  const list = exos.map((e,i)=>{
    const key = dateIso+'_'+i;
    const isDone = !!CHECKED[key];
    return '<li class="ex-item '+(isDone?'done':'')+'" onclick="toggleCheck(\''+key+'\')"><span class="ex-box">'+(isDone?'✓':'')+'</span><span class="ex-text">'+e+'</span></li>';
  }).join('');
  return '<div class="session-card type-'+entry.type+'">'+
    '<div class="session-phase-tag mono">'+(entry.phaseTag||'')+'</div>'+
    '<div class="session-title">'+entry.title+'</div>'+
    '<div class="session-day mono">'+dayLabel+'</div>'+
    rot + progress +
    '<ul class="ex-list">'+list+'</ul>'+
    (entry.note ? '<div class="session-note">'+entry.note+'</div>' : '') +
    '</div>';
}

function renderToday(){
  const entry = getEntry(selectedDate);
  const iso = isoStr(selectedDate);
  const isToday = iso===isoStr(todayOnly());
  const tmr = addDays(selectedDate,1);
  const tmrEntry = getEntry(tmr);
  return '<div class="date-nav">'+
    '<button class="date-nav-btn" onclick="shiftDate(-1)">‹</button>'+
    '<div class="selected-date mono">'+fmtLong(selectedDate)+'</div>'+
    '<button class="date-nav-btn" onclick="shiftDate(1)">›</button>'+
    '</div>'+
    '<div style="display:flex; gap:8px; justify-content:center; margin-bottom:16px; flex-wrap:wrap;">'+
    (!isToday ? '<button class="today-pill" onclick="jumpToday()">Revenir à aujourd\'hui</button>' : '')+
    '<input type="date" value="'+iso+'" min="2026-08-25" max="2028-09-30" onchange="onDatePick(this.value)">'+
    '</div>'+
    sessionCardHTML(entry, fmtLong(selectedDate).split(' ')[0], iso)+
    '<div class="tomorrow-strip" onclick="jumpTo(\''+isoStr(tmr)+'\')">'+ICONS[tmrEntry.icon]+
    '<div><div class="tl mono">Demain</div><div class="tt">'+tmrEntry.title+'</div></div></div>';
}

function renderWeek(){
  const wIdx = (selectedDate.getDay()+6)%7;
  const monday = addDays(selectedDate, -wIdx);
  const days = []; for(let i=0;i<7;i++) days.push(addDays(monday,i));
  const strip = days.map(d=>{
    const e = getEntry(d);
    const sel = isoStr(d)===isoStr(selectedDate) ? 'selected' : '';
    const wd = d.toLocaleDateString('fr-FR',{weekday:'short'}).slice(0,3);
    return '<div class="week-day type-'+e.type+' '+sel+'" onclick="jumpTo(\''+isoStr(d)+'\')"><div class="wd mono">'+wd+'</div><div class="wn">'+d.getDate()+'</div><div class="wt"></div></div>';
  }).join('');
  const entry = getEntry(selectedDate);
  const iso = isoStr(selectedDate);
  return '<div class="section-title">Semaine du '+fmtShort(monday)+'</div>'+
    '<div class="week-strip">'+strip+'</div>'+
    sessionCardHTML(entry, fmtLong(selectedDate).split(' ')[0], iso);
}

function renderPhase(){
  const iso = isoStr(selectedDate);
  const phase = findPhase(iso) || PHASES[0];
  const start = parseDate(phase.start), end = parseDate(phase.end);
  const total = diffDays(end,start);
  const elapsed = Math.min(Math.max(diffDays(selectedDate,start),0), total);
  const pct = total>0 ? elapsed/total : 0;
  const r = 30, circ = 2*Math.PI*r;
  return '<div class="section-title">'+phase.tag+' — '+phase.title+'</div>'+
    '<div class="phase-progress"><svg class="ring" viewBox="0 0 70 70">'+
    '<circle class="ring-track" cx="35" cy="35" r="'+r+'"/>'+
    '<circle class="ring-fill" cx="35" cy="35" r="'+r+'" stroke-dasharray="'+circ+'" stroke-dashoffset="'+(circ*(1-pct))+'"/>'+
    '<text x="35" y="39" class="ring-label mono">'+Math.round(pct*100)+'%</text></svg>'+
    '<div class="phase-desc">'+phase.focus+'</div></div>'+
    '<div class="info-card"><h3 class="mono" style="font-size:12px; letter-spacing:0.05em; text-transform:uppercase; color:var(--grey);">Fenêtre</h3><p class="mono">'+fmtShort(start)+' → '+fmtShort(end)+'</p></div>';
}

function renderMilestones(){
  const today = todayOnly();
  const items = MILESTONES.map(m=>{
    const d = parseDate(m.date); const dd = diffDays(d,today); const past = dd<0;
    return '<div class="milestone '+(past?'past':'')+'"><div><div class="milestone-title">'+m.title+'</div><div class="milestone-date mono">'+fmtShort(d)+'</div></div>'+
      '<div class="milestone-count">'+(past ? 'Passé' : 'J-'+dd)+'<span class="u">'+(past?'':'jours')+'</span></div></div>';
  }).join('');
  return '<div class="section-title">Jalons</div>'+items;
}

function renderContingency(){
  return '<div class="info-card"><span class="level-badge mono">Niveau 1</span><h3>Imprévu ponctuel</h3><p>1-2 séances ratées. Tu sautes, point final — pas de rattrapage. La semaine suivante reprend normalement.</p></div>'+
    '<div class="info-card"><span class="level-badge mono">Niveau 2</span><h3>Semaine perturbée</h3><p>3+ séances ratées. Tu gardes : 1 muscu lourde + 1 séance cardio au choix, celle qui te fait le plus envie. Le reste saute.</p></div>'+
    '<div class="info-card"><span class="level-badge mono">Niveau 3</span><h3>Période prolongée</h3><p>2+ semaines impactées. Mode maintenance minimale : 2 muscu/semaine + 1 sortie cardio libre, sans objectif de progression.</p></div>'+
    '<div class="flag">En cas de doute : la muscu passe toujours avant le triathlon. Une séance peut être déplacée de 24-48h avant d\'être purement sautée.</div>';
}
function renderNutrition(){
  return '<div class="info-card"><p>Aucun chiffre ici — c\'est son rôle. Ce système lui donne des repères pour ajuster avec toi.</p></div>'+
    '<div class="info-card"><h3>Ce qui évolue</h3><p>Le volume d\'entraînement augmente progressivement de 2026 à 2028 — les besoins énergétiques évoluent en conséquence.</p></div>'+
    '<div class="info-card"><h3>Objectif combiné</h3><p>Perte de gras (103kg → ~90kg) + charges lourdes maintenues + volume cardio croissant : ajustement probablement trimestriel.</p></div>'+
    '<div class="info-card"><h3>Quand la solliciter</h3><p>Signale-lui chaque changement de phase pour recaler les apports au bon moment.</p></div>';
}
function renderAlerts(){
  return '<div class="info-card"><h3>Douleur genou</h3><p>Si elle réapparaît sur plusieurs séances, réduis le volume course avant qu\'elle s\'installe. Ne pousse jamais à travers.</p></div>'+
    '<div class="info-card"><h3>Motivation en baisse</h3><p>Une perte d\'envie qui dure plus d\'une semaine : repasse en mode plaisir, ne force pas.</p></div>'+
    '<div class="info-card"><h3>Force qui baisse</h3><p>Perte de charge deux séances de suite : vérifie récupération et nutrition avant de toucher au programme.</p></div>';
}
function renderInfos(){
  const subs = [['contingency',"Imprévus"],['nutrition','Nutrition'],['alerts','Alertes']];
  const pills = subs.map(([k,l])=>'<button class="subnav-btn '+(infoSubTab===k?'active':'')+'" onclick="setInfoSubTab(\''+k+'\')">'+l+'</button>').join('');
  let body = '';
  if(infoSubTab==='contingency') body = renderContingency();
  else if(infoSubTab==='nutrition') body = renderNutrition();
  else body = renderAlerts();
  return '<div class="section-title">Infos</div><div class="subnav">'+pills+'</div>'+body;
}

function renderContent(){
  const el = document.getElementById('content');
  if(activeTab==='today') el.innerHTML = renderToday();
  else if(activeTab==='week') el.innerHTML = renderWeek();
  else if(activeTab==='phase') el.innerHTML = renderPhase();
  else if(activeTab==='milestones') el.innerHTML = renderMilestones();
  else if(activeTab==='infos') el.innerHTML = renderInfos();
}

renderHeader();
renderNav();
renderContent();
setTimeout(()=>{ const b=document.getElementById('boot'); b.style.opacity='0'; setTimeout(()=>b.remove(),300); }, 650);
</script>
</body>
